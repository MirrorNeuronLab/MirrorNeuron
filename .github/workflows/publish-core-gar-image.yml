name: Publish Core GAR Runtime Image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Core Git tag to publish, for example v1.2.30
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish Core runtime image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      GAR_PROJECT: ${{ vars.GAR_PROJECT || 'mirrorneuron-public-packages' }}
      GAR_LOCATION: ${{ vars.GAR_LOCATION || 'us-central1' }}
      GAR_DOCKER_REPOSITORY: ${{ vars.GAR_DOCKER_REPOSITORY || 'mirrorneuron-runtime' }}
      GAR_IMAGE_NAME: ${{ vars.GAR_CORE_IMAGE_NAME || 'mirror-neuron-core' }}

    steps:
      - name: Validate release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          semver_tag_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'
          if [[ ! "$tag" =~ $semver_tag_regex ]]; then
            echo "::error::Invalid Core release tag '$tag'." >&2
            exit 1
          fi

          {
            echo "tag_name=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out maintained release Dockerfile
        uses: actions/checkout@v4
        with:
          path: release-tools

      - name: Check out requested Core source tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag_name }}
          fetch-depth: 0
          path: source

      - name: Verify source checkout matches requested tag
        id: source
        shell: bash
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          set -euo pipefail

          tag_commit="$(git -C source rev-list -n 1 "refs/tags/$TAG_NAME")"
          head_commit="$(git -C source rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "::error::Checked-out source does not match $TAG_NAME." >&2
            exit 1
          fi
          echo "revision=$head_commit" >> "$GITHUB_OUTPUT"

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail

          repository="${GAR_LOCATION}-docker.pkg.dev/${GAR_PROJECT}/${GAR_DOCKER_REPOSITORY}/${GAR_IMAGE_NAME}"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ensure GAR Docker repository is public
        shell: bash
        run: |
          set -euo pipefail

          if ! gcloud artifacts repositories describe "${GAR_DOCKER_REPOSITORY}" \
            --project="${GAR_PROJECT}" \
            --location="${GAR_LOCATION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${GAR_DOCKER_REPOSITORY}" \
              --project="${GAR_PROJECT}" \
              --location="${GAR_LOCATION}" \
              --repository-format=docker \
              --description="MirrorNeuron runtime Docker images"
          fi

          gcloud artifacts repositories add-iam-policy-binding "${GAR_DOCKER_REPOSITORY}" \
            --project="${GAR_PROJECT}" \
            --location="${GAR_LOCATION}" \
            --member=allUsers \
            --role=roles/artifactregistry.reader \
            --condition=None \
            --quiet

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: source
          file: release-tools/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CORE_RELEASE_TAG=${{ steps.version.outputs.tag_name }}
            CORE_REVISION=${{ steps.source.outputs.revision }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag_name }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.version.outputs.tag_name }}
            ${{ steps.image.outputs.repository }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.repository }}:latest
