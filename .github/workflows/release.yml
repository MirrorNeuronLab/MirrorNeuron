name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, such as v1.0.1 or v1.0.1-rc.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          fi
          scripts/validate-version-tag.sh "$tag"

  test:
    name: Test release candidate
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag_name }}

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        env:
          MN_GRPC_PORT: "55051"
          MN_API_PORT: "54000"
          MN_REDIS_URL: "redis://localhost:6379/0"
        run: mix test

      - name: Compile with warnings as errors
        env:
          MIX_PROJECT_VERSION: ${{ needs.validate.outputs.version }}
        run: mix compile --warnings-as-errors

      - name: Check shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -name '*.sh' -print0)

  build-otp:
    name: Build OTP release (${{ matrix.platform }})
    needs:
      - validate
      - test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag_name }}

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        env:
          MIX_PROJECT_VERSION: ${{ needs.validate.outputs.version }}
        run: mix compile --warnings-as-errors

      - name: Build OTP release tarball
        shell: bash
        env:
          MIX_ENV: prod
          MIX_PROJECT_VERSION: ${{ needs.validate.outputs.version }}
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          mix deps.get --only prod
          mix release --overwrite

          release_dir="_build/prod/rel/mirror_neuron"
          if [[ ! -d "$release_dir" ]]; then
            echo "Expected OTP release directory was not created: $release_dir" >&2
            exit 1
          fi

          mkdir -p dist
          tarball="dist/MirrorNeuron-${TAG_NAME}-${PLATFORM}-otp-release.tar.gz"
          if [[ -e "$tarball" ]]; then
            echo "Refusing to overwrite existing OTP release tarball: $tarball" >&2
            exit 1
          fi

          tar -czf "$tarball" -C "$(dirname "$release_dir")" "$(basename "$release_dir")"
          scripts/check-release-artifacts.sh "$tarball"

      - name: Upload OTP release tarball
        uses: actions/upload-artifact@v4
        with:
          name: otp-release-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - validate
      - build-otp
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag_name }}

      - name: Download OTP release tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: otp-release-*
          path: release-assets
          merge-multiple: true

      - name: Create SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets

          mapfile -t tarballs < <(find . -maxdepth 1 -type f -name '*.tar.gz' -print | LC_ALL=C sort)
          if [[ "${#tarballs[@]}" -ne 3 ]]; then
            echo "Expected exactly 3 OTP release tarballs, found ${#tarballs[@]}." >&2
            printf '%s\n' "${tarballs[@]}" >&2
            exit 1
          fi

          shasum -a 256 "${tarballs[@]}" > SHA256SUMS.txt

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \( -name '*.tar.gz' -o -name 'SHA256SUMS.txt' \) | LC_ALL=C sort)
          scripts/check-release-artifacts.sh "${assets[@]}"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
          IS_PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi

          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | LC_ALL=C sort)
          if [[ "${#assets[@]}" -ne 4 ]]; then
            echo "Expected exactly 4 release assets, found ${#assets[@]}." >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi

          release_args=(release create "$TAG_NAME")
          release_args+=("${assets[@]}")
          release_args+=(--title "$TAG_NAME" --verify-tag --generate-notes)

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh "${release_args[@]}"
