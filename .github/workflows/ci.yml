name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mirror-neuron-set/MirrorNeuron
    steps:
      - uses: actions/checkout@v4
        with:
          path: mirror-neuron-set/MirrorNeuron
          fetch-depth: 0
          token: ${{ secrets.MN_GITHUB_TOKEN || secrets.GH_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: MirrorNeuronLab/mn-python-sdk
          path: mirror-neuron-set/mn-python-sdk
          fetch-depth: 0
          token: ${{ secrets.MN_GITHUB_TOKEN || secrets.GH_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: MirrorNeuronLab/mn-system-tests
          path: mirror-neuron-set/mn-system-tests
          fetch-depth: 0
          token: ${{ secrets.MN_GITHUB_TOKEN || secrets.GH_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: MirrorNeuronLab/mn-agents
          path: mirror-neuron-set/mn-agents
          fetch-depth: 0
          token: ${{ secrets.MN_GITHUB_TOKEN || secrets.GH_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: MirrorNeuronLab/mn-skills
          path: mirror-neuron-set/mn-skills
          fetch-depth: 0
          token: ${{ secrets.MN_GITHUB_TOKEN || secrets.GH_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: MirrorNeuronLab/mn-blueprints
          path: mn-blueprints
          fetch-depth: 0
          token: ${{ secrets.MN_GITHUB_TOKEN || secrets.GH_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: MirrorNeuronLab/otterdesk-blueprints
          path: otterdesk-blueprints
          fetch-depth: 0
          token: ${{ secrets.MN_GITHUB_TOKEN || secrets.GH_TOKEN || github.token }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the isolated Core test harness
        run: python -m pip install -e ../mn-system-tests
      # The harness pins production Elixir/OTP, installs SDK dependencies and
      # owns its Redis/state. No host Elixir, Docker socket mount or job data.
      - name: Check formatting
        run: python -m mn_system_tests.elixir --source . format --check-formatted
      - name: Run tests
        run: python -m mn_system_tests.elixir --source . test
      - name: Compile with warnings as errors
        run: python -m mn_system_tests.elixir --source . compile --force --warnings-as-errors
      - name: Check shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -name '*.sh' -print0)
