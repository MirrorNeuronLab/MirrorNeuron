syntax = "proto3";
package mirrorneuron.observability.v1;

service ObservabilityService {
  rpc StreamEvents (StreamEventsRequest) returns (stream EventResponse);
}

message StreamEventsRequest {
  string job_id = 1;
  bool follow = 2;
  int32 heartbeat_interval_ms = 3;
  int32 limit = 4;
  uint32 version = 5;
}

message EventResponse {
  string event_json = 1;
  uint32 version = 2;
}
