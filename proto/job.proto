syntax = "proto3";
package mirrorneuron.job.v1;

service JobService {
  rpc SubmitJob (SubmitJobRequest) returns (SubmitJobResponse);
  rpc GetJob (GetJobRequest) returns (GetJobResponse);
  rpc ListJobs (ListJobsRequest) returns (ListJobsResponse);
  rpc CancelJob (CancelJobRequest) returns (CancelJobResponse);
  rpc PauseJob (PauseJobRequest) returns (PauseJobResponse);
  rpc ResumeJob (ResumeJobRequest) returns (ResumeJobResponse);
  rpc ExportJobBackup (ExportJobBackupRequest) returns (ExportJobBackupResponse);
  rpc RestoreJobBackup (RestoreJobBackupRequest) returns (RestoreJobBackupResponse);
  rpc ClearJobs (ClearJobsRequest) returns (ClearJobsResponse);
  rpc DeployJob (DeployJobRequest) returns (DeploymentResponse);
  rpc UpdateDeployment (UpdateDeploymentRequest) returns (DeploymentResponse);
  rpc GetDeployment (GetDeploymentRequest) returns (DeploymentResponse);
  rpc ListDeployments (ListDeploymentsRequest) returns (DeploymentResponse);
  rpc PromoteDeployment (PromoteDeploymentRequest) returns (DeploymentResponse);
  rpc RollbackDeployment (RollbackDeploymentRequest) returns (DeploymentResponse);
  rpc PauseDeployment (DeploymentActionRequest) returns (DeploymentResponse);
  rpc ResumeDeployment (DeploymentActionRequest) returns (DeploymentResponse);
  rpc FailDeployment (DeploymentActionRequest) returns (DeploymentResponse);
  rpc CreateSchedule (CreateScheduleRequest) returns (ScheduleResponse);
  rpc UpdateSchedule (ScheduleActionRequest) returns (ScheduleResponse);
  rpc GetSchedule (GetScheduleRequest) returns (ScheduleResponse);
  rpc ListSchedules (ListSchedulesRequest) returns (ScheduleResponse);
  rpc PauseSchedule (ScheduleActionRequest) returns (ScheduleResponse);
  rpc ResumeSchedule (ScheduleActionRequest) returns (ScheduleResponse);
  rpc DeleteSchedule (ScheduleActionRequest) returns (ScheduleResponse);
  rpc DispatchSchedule (DispatchScheduleRequest) returns (ScheduleResponse);
  rpc EmitTriggerEvent (EmitTriggerEventRequest) returns (ScheduleResponse);
  rpc ListTriggerEvents (ListTriggerEventsRequest) returns (ScheduleResponse);
}

message SubmitJobRequest {
  string manifest_json = 1;
  map<string, bytes> payloads = 2;
  uint32 version = 3;
}

message SubmitJobResponse {
  string job_id = 1;
  string status = 2;
  uint32 version = 3;
}

message GetJobRequest {
  string job_id = 1;
  uint32 version = 2;
}

message GetJobResponse {
  string job_json = 1;
  uint32 version = 2;
}

message ListJobsRequest {
  int32 limit = 1;
  bool include_terminal = 2;
  uint32 version = 3;
}

message ListJobsResponse {
  string jobs_json = 1;
  uint32 version = 2;
}

message CancelJobRequest {
  string job_id = 1;
  uint32 version = 2;
}

message CancelJobResponse {
  string job_id = 1;
  string status = 2;
  uint32 version = 3;
}

message PauseJobRequest {
  string job_id = 1;
  uint32 version = 2;
}

message PauseJobResponse {
  string job_id = 1;
  string status = 2;
  uint32 version = 3;
}

message ResumeJobRequest {
  string job_id = 1;
  uint32 version = 2;
}

message ResumeJobResponse {
  string job_id = 1;
  string status = 2;
  uint32 version = 3;
}

message ExportJobBackupRequest {
  string job_id = 1;
  uint32 version = 2;
}

message ExportJobBackupResponse {
  string backup_json = 1;
  map<string, bytes> bundle_files = 2;
  uint32 version = 3;
}

message RestoreJobBackupRequest {
  string backup_json = 1;
  map<string, bytes> bundle_files = 2;
  string blueprint_id = 3;
  string run_id = 4;
  uint32 version = 5;
}

message RestoreJobBackupResponse {
  string result_json = 1;
  uint32 version = 2;
}

message ClearJobsRequest {
  string admin_token = 1;
  uint32 version = 2;
}

message ClearJobsResponse {
  int32 cleared_count = 1;
  uint32 version = 2;
}

message DeployJobRequest {
  string manifest_json = 1;
  map<string, bytes> payloads = 2;
  string deployment_key = 3;
  string update_policy_json = 4;
  bool wait = 5;
  uint32 version = 6;
}

message UpdateDeploymentRequest {
  string deployment_key = 1;
  string manifest_json = 2;
  map<string, bytes> payloads = 3;
  string update_policy_json = 4;
  bool wait = 5;
  uint32 version = 6;
}

message GetDeploymentRequest {
  string id_or_key = 1;
  uint32 version = 2;
}

message ListDeploymentsRequest {
  string query_json = 1;
  uint32 version = 2;
}

message PromoteDeploymentRequest {
  string id_or_key = 1;
  uint32 version = 2;
}

message RollbackDeploymentRequest {
  string id_or_key = 1;
  string version = 2;
  string tag = 3;
  string reason = 4;
}

message DeploymentActionRequest {
  string id_or_key = 1;
  string reason = 2;
  uint32 version = 3;
}

message DeploymentResponse {
  string result_json = 1;
  uint32 version = 2;
}

message CreateScheduleRequest {
  string manifest_json = 1;
  map<string, bytes> payloads = 2;
  string schedule_json = 3;
  string source_json = 4;
  uint32 version = 5;
}

message ScheduleActionRequest {
  string schedule_id = 1;
  string attrs_json = 2;
  string reason = 3;
  uint32 version = 4;
}

message GetScheduleRequest {
  string schedule_id = 1;
  uint32 version = 2;
}

message ListSchedulesRequest {
  string query_json = 1;
  uint32 version = 2;
}

message DispatchScheduleRequest {
  string schedule_id = 1;
  string payload_json = 2;
  string reason = 3;
  uint32 version = 4;
}

message EmitTriggerEventRequest {
  string event_type = 1;
  string payload_json = 2;
  string source = 3;
  uint32 version = 4;
}

message ListTriggerEventsRequest {
  int32 limit = 1;
  uint32 version = 2;
}

message ScheduleResponse {
  string result_json = 1;
  uint32 version = 2;
}
