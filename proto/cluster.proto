syntax = "proto3";
package mirrorneuron.cluster.v1;

service ClusterService {
  rpc GetSystemSummary (GetSystemSummaryRequest) returns (GetSystemSummaryResponse);
  rpc GetResource (GetResourceRequest) returns (GetResourceResponse);
  rpc SetResource (SetResourceRequest) returns (SetResourceResponse);
  rpc RemoveNode (RemoveNodeRequest) returns (RemoveNodeResponse);
  rpc ReconcileNode (ReconcileNodeRequest) returns (ReconcileNodeResponse);
}

message GetSystemSummaryRequest {}

message GetSystemSummaryResponse {
  string summary_json = 1;
}

message GetResourceRequest {}

message GetResourceResponse {
  string resource_json = 1;
}

message SetResourceRequest {
  string resource_json = 1;
}

message SetResourceResponse {
  string resource_json = 1;
}

message RemoveNodeRequest {
  string node_name = 1;
}

message RemoveNodeResponse {
  string node_name = 1;
  string status = 2;
}

message ReconcileNodeRequest {
  string node_name = 1;
  string reason = 2;
  bool dry_run = 3;
}

message ReconcileNodeResponse {
  string result_json = 1;
}
